name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Syntax check all backend files
        run: find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} \;

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build production bundle (Linux — catches case-sensitivity bugs Windows misses)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}