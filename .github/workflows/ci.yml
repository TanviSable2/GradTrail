name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Syntax check all backend files
        run: find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} \;

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Build production bundle (Linux — catches case-sensitivity bugs Windows misses)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]  # only runs if BOTH above jobs pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # skip on PRs
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail
        # --fail makes curl return non-zero exit code if Render returns an error response

      - name: Wait for Render to deploy
        run: sleep 90
        # Render typically takes 60-90 seconds to pull, build, and restart

      - name: Verify backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gradtrail.onrender.com/health)
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED — backend may not have deployed correctly"
            exit 1
          fi
          echo "Health check PASSED — backend is live and responding"